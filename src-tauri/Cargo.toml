[package]
name = "clio"
version = "1.0.0"
description = "Clio - Gravador de Oitivas e Audiências"
authors = ["MPTO"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "clio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Evita que o Cargo procure (e falhe) um workspace manifest em diretórios pai.
[workspace]
